apiVersion: apps/v1
kind: Deployment
metadata:
  name: ams-frontend
  labels:
    app: ams-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ams-frontend
  template:
    metadata:
      labels:
        app: ams-frontend
    spec:
      containers:
        - name: frontend
          image: ams-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ams-frontend
spec:
  selector:
    app: ams-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
