apiVersion: apps/v1
kind: Deployment
metadata:
  name: ams-backend
  labels:
    app: ams-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ams-backend
  template:
    metadata:
      labels:
        app: ams-backend
    spec:
      containers:
        - name: backend
          image: ams-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: ams-config
                  key: APP_ENV
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: ams-secrets
                  key: APP_KEY
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ams-config
                  key: DB_HOST
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: ams-config
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ams-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ams-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ams-backend
spec:
  selector:
    app: ams-backend
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
